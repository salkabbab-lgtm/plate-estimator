<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقدير سعر اللوحة · Plate Price Estimator</title>
<style>
  :root { --bg:#0f1c1a; --card:#16302b; --accent:#d4af37; --text:#eaf1ee; --muted:#9fb3ad; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Tajawal',system-ui,Arial,sans-serif; background:var(--bg);
         color:var(--text); min-height:100vh; display:flex; align-items:flex-start;
         justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:560px; }
  h1 { font-size:24px; margin:0 0 4px; text-align:center; }
  .sub { color:var(--muted); text-align:center; margin:0 0 24px; font-size:14px; }
  .card { background:var(--card); border-radius:16px; padding:24px;
          box-shadow:0 10px 30px rgba(0,0,0,.35); }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; gap:12px; align-items:flex-end; }
  .row > div { flex:1; }
  input { width:100%; padding:14px; font-size:20px; text-align:center; border-radius:10px;
          border:1px solid #2c4a43; background:#0d201d; color:var(--text); }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:18px; padding:14px; font-size:17px; font-weight:700;
           border:none; border-radius:10px; background:var(--accent); color:#1a1a1a; cursor:pointer; }
  button:hover { filter:brightness(1.05); }
  .result { margin-top:22px; display:none; }
  .plate-str { text-align:center; font-size:18px; margin-bottom:14px; letter-spacing:2px; }
  .headline { text-align:center; }
  .hlabel { color:var(--muted); font-size:13px; margin-bottom:4px; }
  .price { font-size:38px; font-weight:800; color:var(--accent); }
  .range { color:var(--muted); margin-top:4px; font-size:13px; }
  .secondary { text-align:center; color:var(--muted); font-size:13px; margin-top:10px; }
  .verdict { margin-top:16px; padding:16px; border-radius:12px; text-align:center; line-height:1.55; }
  .verdict b { display:block; font-size:18px; margin-bottom:6px; }
  .verdict.good { background:rgba(121,210,155,.14); border:1px solid #79d29b; color:#cdeedb; }
  .verdict.fair { background:rgba(212,175,55,.14); border:1px solid var(--accent); color:#f0e2b8; }
  .verdict.high { background:rgba(255,138,128,.14); border:1px solid #ff8a80; color:#ffd9d4; }
  .offer { margin-top:14px; }
  .avail { margin-top:18px; }
  .avail h3 { font-size:13px; color:var(--muted); font-weight:600; margin:0 0 8px; line-height:1.4; }
  .lrow { display:flex; align-items:center; gap:10px; padding:10px 12px; margin-bottom:8px;
          background:#0d201d; border:1px solid #2c4a43; border-radius:10px; text-decoration:none;
          color:var(--text); }
  .lrow:hover { border-color:var(--accent); }
  .lsrc { font-size:11px; color:var(--muted); background:rgba(255,255,255,.05);
          padding:2px 7px; border-radius:20px; white-space:nowrap; }
  .lplate { flex:1; font-weight:700; letter-spacing:1px; }
  .lprice { color:var(--accent); font-weight:700; white-space:nowrap; }
  .lnote { color:var(--muted); font-size:13px; padding:4px 0; }
  .factors { margin-top:18px; border-top:1px solid #2c4a43; padding-top:14px; }
  .factors h3 { font-size:13px; color:var(--muted); font-weight:600; margin:0 0 10px; }
  .frow { display:flex; justify-content:space-between; align-items:center; gap:12px;
          font-size:14px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,.04); }
  .frow:last-child { border-bottom:none; }
  .frow .lbl { color:var(--text); }
  .frow .eff { font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
  .eff.up { color:#79d29b; }
  .eff.down { color:#ff8a80; }
  .eff.flat { color:var(--muted); }
  .meta { text-align:center; color:var(--muted); font-size:12px; margin-top:16px; }
  .err { color:#ff8a80; text-align:center; margin-top:14px; }
  .examples { text-align:center; margin-top:12px; font-size:13px; color:var(--muted); }
  .examples a { color:var(--accent); cursor:pointer; text-decoration:none; margin:0 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>تقدير سعر اللوحة</h1>
  <p class="sub">Saudi Plate Price Estimator — enter letters &amp; numbers</p>
  <div class="card">
    <div class="row">
      <div>
        <label>الأحرف · Letters</label>
        <input id="letters" placeholder="م م م" autocomplete="off">
      </div>
      <div>
        <label>الأرقام · Numbers</label>
        <input id="numbers" placeholder="777" inputmode="numeric" autocomplete="off">
      </div>
    </div>
    <div class="offer">
      <label>السعر المعروض عليك (اختياري) · Price you're offered (optional)</label>
      <input id="offer" inputmode="numeric" placeholder="مثال · e.g. 20000" autocomplete="off">
    </div>
    <button id="go">قيّم اللوحة · Check the plate</button>
    <div class="examples">
      جرّب:
      <a data-l="م م م" data-n="777">م م م 777</a>
      <a data-l="أ" data-n="1">أ 1</a>
      <a data-l="س ب ح" data-n="7271">س ب ح 7271</a>
    </div>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div class="plate-str" id="plateStr"></div>
      <div class="headline">
        <div class="hlabel">القيمة التقديرية عند إعادة البيع · Estimated resale value</div>
        <div class="price" id="sellPrice"></div>
        <div class="range" id="sellRange"></div>
      </div>
      <div class="verdict" id="verdict" style="display:none"></div>
      <div class="secondary" id="secondary"></div>
      <div class="avail" id="avail"></div>
      <div class="factors">
        <h3>ما الذي يؤثر في السعر · What affects the price</h3>
        <div id="factors"></div>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
</div>

const SOURCE_NAME = { j6j6e: "j6j6e.com", luhah: "luhah.sa", lu7ah: "lu7ah.com" };
const LAT2AR = {A:"ا",B:"ب",J:"ح",D:"د",R:"ر",S:"س",X:"ص",T:"ط",E:"ع",G:"ق",K:"ك",L:"ل",Z:"م",N:"ن",H:"ه",U:"و",V:"ى"};
function arLetters(latin){ return latin.split("").map(c => LAT2AR[c] || c).join(" "); }

// ===== Port of pricing/letters.py =====
const AR2LAT = {"ا":"A","ب":"B","ح":"J","د":"D","ر":"R","س":"S","ص":"X","ط":"T","ع":"E",
  "ق":"G","ك":"K","ل":"L","م":"Z","ن":"N","ه":"H","ى":"V","أ":"A","إ":"A","آ":"A","ي":"V","ة":"H"};
function splitPlate(number) {
  let letters = "", digits = "";
  for (const ch of number) {
    if (/\s/.test(ch)) continue;
    const code = ch.codePointAt(0);
    if (ch >= "0" && ch <= "9") { digits += ch; }
    else if (code >= 0x660 && code <= 0x669) { digits += String(code - 0x660); } // ٠-٩
    else { letters += (AR2LAT[ch] || ch.toUpperCase()); }
  }
  return [letters, digits];
}

// ===== Live availability lookup over the embedded listings =====
function lookup(letters, numbers){
  if (!letters) return { type: "none", items: [] };
  // Match the exact letter SEQUENCE (DES stays DES, not SED).
  const exact = LISTINGS.filter(x => x.n === numbers && x.l === letters);
  if (exact.length) return { type: "exact", items: exact.slice().sort((a,b)=>a.p-b.p) };
  // Keep the letters fixed; show other plates with the same letter sequence
  // (different numbers), closest number first.
  const qn = parseInt(numbers || "0", 10), qd = numbers.length;
  const sameLetters = LISTINGS.filter(x => x.l === letters);
  if (sameLetters.length){
    sameLetters.sort((a,b) =>
      ((a.n.length===qd?0:1) - (b.n.length===qd?0:1)) ||
      (Math.abs(parseInt(a.n,10)-qn) - Math.abs(parseInt(b.n,10)-qn)) ||
      (a.p - b.p));
    return { type: "closest", items: sameLetters.slice(0, 6) };
  }
  return { type: "none", items: [] };
}

// ===== Port of pricing/features.py =====
const FEATURE_NAMES = ["digit_count","letter_pattern","digit_pattern","digit_repeat","roundness"];
function counts(str) { const m = {}; for (const c of str) m[c]=(m[c]||0)+1; return Object.values(m); }
function letterPattern(letters) {
  const sig = counts(letters).sort((a,b)=>b-a).join(",");
  return {"3":"AAA","2,1":"AAB","1,1,1":"ABC","2":"AA","1,1":"AB","1":"A","":"NONE"}[sig] || "OTHER";
}
function digitPattern(d) {
  if (!d) return "none";
  if (d.length === 1) return "single";
  if (new Set(d).size === 1) return "same";
  if (d === [...d].reverse().join("")) return "palindrome";
  let asc=true, desc=true;
  for (let i=0;i<d.length-1;i++){ if(+d[i]+1!==+d[i+1])asc=false; if(+d[i]-1!==+d[i+1])desc=false; }
  if (asc||desc) return "sequence";
  const n = parseInt(d,10);
  if (n%1000===0 || n%100===0) return "round";
  return "mixed";
}
function maxRepeat(d){ return d ? Math.max(...counts(d)) : 0; }
function trailingZeros(d){ if(!d || [...new Set(d)].join("")==="0") return 0; return d.length - d.replace(/0+$/,"").length; }
function plateFeatures(letters, digits) {
  return {
    digit_count: String(digits.length),
    letter_pattern: letterPattern(letters),
    digit_pattern: digitPattern(digits),
    digit_repeat: String(maxRepeat(digits)),
    roundness: String(trailingZeros(digits)),
  };
}

// ===== Port of pricing/describe.py =====
const LABELS = {
  letter_pattern: {
    AAA:"ثلاثة أحرف متطابقة · All three letters the same",
    AAB:"حرفان متطابقان · Two letters match",
    ABC:"ثلاثة أحرف مختلفة · Three different letters",
    AA:"حرفان متطابقان · Both letters the same",
    AB:"حرفان مختلفان · Two different letters",
    A:"حرف واحد · Single letter",
    OTHER:"تركيبة أحرف غير معتادة · Unusual letter combination",
    NONE:"بدون أحرف · No letters",
  },
  digit_pattern: {
    same:"أرقام متكررة مثل 777 · Repeated digits (e.g. 777)",
    sequence:"أرقام متسلسلة مثل 1234 · Sequential digits (e.g. 1234)",
    palindrome:"رقم متماثل مثل 1221 · Mirror number (e.g. 1221)",
    round:"رقم دائري مثل 5000 · Round number (e.g. 5000)",
    single:"رقم من خانة واحدة · Single-digit number",
    mixed:"رقم عادي · Ordinary number",
    none:"بدون أرقام · No number",
  },
};
const DYN = {
  digit_count: v => ({"1":"رقم من خانة واحدة · Single digit","2":"رقم من خانتين · 2 digits",
    "3":"رقم من ٣ خانات · 3 digits","4":"رقم من ٤ خانات · 4 digits"}[v] || v+" digits"),
  digit_repeat: v => ({"0":"—","1":"بدون أرقام مكررة · No repeating digit",
    "2":"رقم يتكرر مرتين · A digit repeats twice","3":"رقم يتكرر ٣ مرات · A digit repeats 3 times",
    "4":"أربعة أرقام متطابقة · Four identical digits"}[v] || ("a digit repeats "+v+"×")),
  roundness: v => ({"0":"لا ينتهي بأصفار · Doesn't end in zeros","1":"ينتهي بصفر · Ends in one zero",
    "2":"ينتهي بصفرين · Ends in two zeros","3":"ينتهي بثلاثة أصفار · Ends in three zeros"}[v] || ("ends in "+v+" zeros")),
};
function labelFor(f, v){ if (LABELS[f]) return LABELS[f][v] || (f+": "+v); if (DYN[f]) return DYN[f](v); return f+": "+v; }
function effectText(mult){ const pct=(mult-1)*100; if (Math.abs(pct)<4) return "≈ no change";
  return (pct>0?"+":"−")+Math.abs(Math.round(pct))+"%"; }

// ===== Port of pricing/model.py estimate_both() =====
const Z = 0.674;
const ANCHOR_SELL = "luhah", ANCHOR_LIST = "lu7ah";
const FIT_NAMES = MODEL.feature_names || FEATURE_NAMES;
const HAS_SOURCE = FIT_NAMES.indexOf("source") !== -1;
function clip(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
function scoreLog(feats) {
  let log = MODEL.global_log;
  for (const name of FIT_NAMES) {
    log += (MODEL.factors[name] && MODEL.factors[name][feats[name]]) || 0;
  }
  return log;
}
function band(log) {
  return {
    estimate: Math.round(clip(Math.exp(log), MODEL.price_min, MODEL.price_max)),
    low: Math.round(clip(Math.exp(log - Z*MODEL.sigma), MODEL.price_min, MODEL.price_max)),
    high: Math.round(clip(Math.exp(log + Z*MODEL.sigma), MODEL.price_min, MODEL.price_max)),
  };
}
function estimate(plate) {
  const [letters, digits] = splitPlate(plate);
  const feats = plateFeatures(letters, digits);
  // plate-feature breakdown (source excluded — it's not a plate trait)
  const breakdown = FEATURE_NAMES.map(name => {
    const mult = Math.exp((MODEL.factors[name] && MODEL.factors[name][feats[name]]) || 0);
    return { label: labelFor(name, feats[name]), effect: effectText(mult),
             pct: Math.round((mult-1)*100) };
  }).filter(b => Math.abs(b.pct) >= 4).sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));

  let sell, list;
  if (HAS_SOURCE) {
    sell = band(scoreLog(Object.assign({}, feats, {source: ANCHOR_SELL})));
    list = band(scoreLog(Object.assign({}, feats, {source: ANCHOR_LIST})));
  } else {
    sell = list = band(scoreLog(feats));
  }
  return { plate: (letters+" "+digits).trim(), sell, list, breakdown };
}

// ===== UI =====
const $ = id => document.getElementById(id);
function run() {
  const letters = $('letters').value.trim(), numbers = $('numbers').value.trim();
  $('err').textContent = '';
  if (!letters && !numbers) { $('err').textContent = 'أدخل اللوحة · enter a plate'; return; }
  render(estimate((letters+" "+numbers).trim()));
}
function toAscii(s){ return s.replace(/[٠-٩]/g, c => String(c.charCodeAt(0)-0x660)); }
function money(n){ return n.toLocaleString() + ' ﷼'; }

function render(d) {
  $('plateStr').textContent = d.plate;
  $('sellPrice').textContent = money(d.sell.estimate);
  $('sellRange').textContent = 'الأرجح بين · likely ' + d.sell.low.toLocaleString() + ' – ' + d.sell.high.toLocaleString() + ' ﷼';
  $('secondary').textContent = 'يُعرض عادةً في الإعلانات بحوالي · typically listed around ' + money(d.list.estimate);
  renderVerdict(d);
  renderAvailability(d.plate);
  const f = $('factors'); f.innerHTML = '';
  if (!d.breakdown.length) f.innerHTML = '<div class="frow"><span class="lbl">لا توجد عوامل مميّزة · nothing notable about this plate</span></div>';
  for (const b of d.breakdown) {
    const cls = b.pct>0?'up':(b.pct<0?'down':'flat');
    const arrow = b.pct>0?'▲ يرفع السعر':(b.pct<0?'▼ يخفض السعر':'');
    const row = document.createElement('div'); row.className='frow';
    row.innerHTML = '<span class="lbl">'+b.label+'</span><span class="eff '+cls+'">'+arrow+' '+b.effect+'</span>';
    f.appendChild(row);
  }
  $('meta').textContent = 'تقدير تقريبي بناءً على ' + MODEL.n_samples.toLocaleString() +
                          ' لوحة معروضة · estimate based on ' + MODEL.n_samples.toLocaleString() + ' listings';
  $('result').style.display = 'block';
}

function renderVerdict(d) {
  const v = $('verdict');
  const off = parseFloat(toAscii($('offer').value).replace(/[^\d.]/g,''));
  if (!off || off <= 0) { v.style.display = 'none'; return; }
  const S = d.sell.estimate, L = d.list.estimate, profit = S - off;
  let cls, head, body;
  if (off <= S) {
    cls = 'good'; head = '✅ صفقة جيدة · Good deal';
    body = 'سعر الشراء أقل من قيمة إعادة البيع. يمكنك إعادة بيعها بحوالي ' + money(S) +
           '، بربح تقديري ~' + money(profit) + '.\n' +
           'Below resale value — you could resell around ' + money(S) + ' for ~' + money(profit) + ' profit.';
  } else if (off <= L) {
    cls = 'fair'; head = '⚖️ هامش ضعيف · Tight margin';
    body = 'أعلى من قيمة البيع السريع (' + money(S) + ') لكنه ضمن نطاق أسعار العرض. لن تربح إلا إذا بعتها قرب أعلى سعر (~' + money(L) + ').\n' +
           'Above quick-sale value but within the asking range — only profits if you sell near the top (~' + money(L) + ').';
  } else {
    cls = 'high'; head = '❌ مرتفع · Overpriced';
    body = 'أعلى من سعر العرض المعتاد (' + money(L) + ') بـ ' + money(off - L) + '. لا يوجد هامش لإعادة البيع.\n' +
           'Above typical asking (' + money(L) + ') — no resale margin.';
  }
  v.className = 'verdict ' + cls;
  v.innerHTML = '<b>' + head + '</b>' + body.replace(/\n/g, '<br>');
  v.style.display = 'block';
}

function listingRows(items){
  return items.map(x =>
    '<a class="lrow" href="' + (x.u||'#') + '" target="_blank" rel="noopener">' +
    '<span class="lsrc">' + (SOURCE_NAME[x.s]||x.s) + '</span>' +
    '<span class="lplate">' + arLetters(x.l) + ' ' + x.n + '</span>' +
    '<span class="lprice">' + x.p.toLocaleString() + ' ﷼</span></a>').join('');
}
function renderAvailability(plate){
  const [letters, numbers] = splitPlate(plate);
  const r = lookup(letters, numbers);
  const a = $('avail');
  if (r.type === 'exact'){
    a.innerHTML = '<h3>📍 معروضة حالياً في المصادر · Currently listed — asking price:</h3>' + listingRows(r.items);
  } else if (r.type === 'closest'){
    a.innerHTML = '<h3>لا يوجد عرض مطابق — لوحات أخرى بنفس الأحرف · No exact listing — other plates with the same letters:</h3>' + listingRows(r.items);
  } else {
    a.innerHTML = '<div class="lnote">غير معروضة حالياً في المصادر · not currently listed in the sources.</div>';
  }
}

['letters','numbers','offer'].forEach(id =>

document.querySelectorAll('.examples a').forEach(a => a.addEventListener('click', () => {
